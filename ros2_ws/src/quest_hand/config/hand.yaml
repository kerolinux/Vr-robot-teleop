udp_hand_receiver:
  ros__parameters:
    host: 0.0.0.0
    port: 5006
    frame_id: quest_world
    topic_template: /quest/{hand}_hand/skeleton_raw

hand_conditioner:
  ros__parameters:
    hand: right
    input_topic: /quest/right_hand/skeleton_raw
    output_topic: /teleop/right_hand/keypoints
    marker_topic: /teleop/right_hand/markers
    viz_frame: world              # RViz fixed frame to draw the skeleton in
    viz_origin: [0.4, -0.5, 0.4]  # where the (wrist-frame) skeleton is drawn
    filter:
      min_cutoff: 2.0             # Hz, lower = smoother when still
      beta: 15.0                  # higher = less lag on fast finger motion
      d_cutoff: 1.0
      reset_gap: 0.5              # s of lost tracking before a joint's filter restarts
      min_fresh_fraction: 0.8     # fraction of joints that must be fresh for tracked=true

hand_inputs:
  ros__parameters:
    left_topic: /quest/left_hand/skeleton_raw
    right_topic: /quest/right_hand/skeleton_raw
    clutch_topic: /quest/clutch
    clutch_hand: left             # pinch THIS hand's thumb and index finger to engage the robot
    pinch_open_dist: 0.07         # m: fingertips at least this far apart = 0 (open)
    pinch_closed_dist: 0.02       # m: fingertips this close = 1 (pinched). teleop_core engages above 0.8
    publish_pose: false           # true with the real headset: also publish the right wrist pose + pinch
    input_timeout: 0.25           # s: if the clutch hand's packets stop, publish 0 (clutch released)
